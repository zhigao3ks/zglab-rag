[project]
name = "zglab-rag"
version = "0.1.0"
description = "Personal knowledge assistant for ZGLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23",
  "beautifulsoup4>=4.12",
  "fastapi",
  "httpx>=0.28",
  "numpy>=2,<3",
  "psutil>=6,<8",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "sentence-transformers>=5.1,<6",
  "sqlite-vec==0.1.9",
  "torch==2.7.1",
  "uvicorn[standard]",
]

[project.scripts]
zglab-rag = "zglab_rag.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zglab_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "zglab-rag"
version = "0.1.0"
description = "Personal knowledge assistant for ZGLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zglab_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

server {
    listen 80;
    listen [::]:80;
    server_name ask.zglab.fun;
    root /var/www/zglab-assistant;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        return 503;
    }
}

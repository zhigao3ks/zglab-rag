server {
    listen 80;
    listen [::]:80;
    server_name ask.zglab.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ask.zglab.fun;

    # Managed by certbot after the DNS record points to this server.
    ssl_certificate /etc/letsencrypt/live/ask.zglab.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ask.zglab.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zglab-assistant;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Nginx add_header inheritance is all-or-nothing: once a location declares
    # any add_header of its own it no longer inherits the server-level set.
    # /api/, static assets and / therefore repeat the Phase 11 security headers
    # locally because they also add X-Accel-Buffering or Cache-Control.

    # Internal capabilities are reachable only over the loopback Uvicorn
    # listener. Never proxy them through the public virtual host.
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE must be forwarded progressively rather than accumulated by Nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        add_header X-Accel-Buffering no always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        # Keep one explicit Cache-Control header. Using `expires 7d` as well
        # would emit a second Cache-Control field alongside this immutable one.
        expires off;
        add_header Cache-Control "public, max-age=604800, immutable" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Phase 11: conservative CSP for the same-origin SPA. All scripts and
    # styles ship as external build assets; 'unsafe-inline' is only kept for
    # style to avoid breaking runtime style bindings. API calls stay same
    # origin (connect-src 'self'), so cookies/CSRF behaviour is unchanged.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}

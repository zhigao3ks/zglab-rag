name: phase12-tail-trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'maintenance/phase12-tail-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/phase12-tail-cleanup
          fetch-depth: 0

      - name: Execute cleanup payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/phase12-tail-cleanup.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(code, 'phase12-tail-cleanup', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m compileall -q src tests/test_phase12_maintenance.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          main = Path('src/zglab_rag/api/main.py').read_text(encoding='utf-8')
          architecture = Path('docs/architecture.md').read_text(encoding='utf-8')
          assert '"/api/v2/auth/reset-password",' in main
          assert 'request.url.path' in main
          assert 'Request Validation → Kill Switch' not in architecture
          PY

      - name: Commit patch to maintenance branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zglab_rag/api/main.py docs/architecture.md docs/production-architecture.md tests/test_phase12_maintenance.py
          git diff --cached --quiet && exit 0
          git commit -m "chore: close phase 12 maintenance tails"
          git push origin HEAD:maintenance/phase12-tail-cleanup

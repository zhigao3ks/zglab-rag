version: 1

# Only sources explicitly registered here are eligible for ingestion.
# Public assistant retrieval must still enforce visibility=public at query time.

sources:
  - id: identity-profile
    enabled: true
    kind: local
    scope: identity
    visibility: public
    priority: 100
    path: knowledge/identity/profile.md
    include:
      - knowledge/identity/profile.md
    exclude: []

  - id: notes
    enabled: true
    kind: git
    scope: knowledge
    visibility: public
    priority: 80
    repository: zhigao3ks/notes
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/notes
    # Legacy development override for older configs. Managed checkout is used
    # whenever acquisition is configured.
    local_path: ../notes
    include:
      - README.md
      - knowledge/**/*.md
      - projects/**/*.md
      - problems/**/*.md
    exclude:
      - archive/**
      - inbox/**
      - figures/**
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-website
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 90
    repository: zhigao3ks/zglab-website
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-website
    local_path: ../zglab-website
    include:
      - README.md
      - src/data/profile.yaml
      - src/data/publications.yaml
      - src/data/awards.yaml
      - src/content/projects/**/*.md
      - docs/**/*.md
    exclude:
      - public/**
      - package-lock.json
      - dist/**
      - "**/node_modules/**"
      - "**/.git/**"

  - id: resume-tailor-agent
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 90
    repository: zhigao3ks/resume-tailor-agent
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/resume-tailor-agent
    local_path: ../resume-tailor-agent
    include:
      - README.md
      - docs/**/*.md
      - PROJECT_KNOWLEDGE.md
    exclude:
      - src/**
      - tests/**
      - '*.lock'
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-tools
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 85
    repository: zhigao3ks/zglab-tools
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-tools
    local_path: ../zglab-tools
    include:
      - README.md
      - docs/**/*.md
      - PROJECT_KNOWLEDGE.md
    exclude:
      - src/**
      - dist/**
      - node_modules/**
      - package-lock.json
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-daily
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 80
    repository: zhigao3ks/zglab-daily
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-daily
    local_path: ../zglab-daily
    include:
      - README.md
      - docs/**/*.md
      - PROJECT_KNOWLEDGE.md
    exclude:
      - frontend/node_modules/**
      - '**/__pycache__/**'
      - '*.db'
      - '*.sqlite*'
      - "**/node_modules/**"
      - "**/.git/**"

# Private/company sources are intentionally absent from the public source registry.
# Do not add them to the public index merely because the GitHub account can access them.

version: 1

# Only sources explicitly registered here are eligible for ingestion.
# Public assistant retrieval must still enforce visibility=public at query time.

sources:
  - id: identity-profile
    enabled: true
    kind: local
    scope: identity
    visibility: public
    priority: 100
    path: knowledge/identity/profile.md
    include:
      - knowledge/identity/profile.md
    exclude: []

  - id: notes
    enabled: true
    kind: git
    scope: knowledge
    visibility: public
    priority: 80
    repository: zhigao3ks/notes
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/notes
    # Legacy development override for older configs. Managed checkout is used
    # whenever acquisition is configured.
    local_path: ../notes
    include:
      - README.md
      - knowledge/**/*.md
      - projects/**/*.md
      - problems/**/*.md
    exclude:
      - archive/**
      - inbox/**
      - figures/**
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-website
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 90
    repository: zhigao3ks/zglab-website
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-website
    local_path: ../zglab-website
    include:
      - README.md
      - src/data/profile.yaml
      - src/data/publications.yaml
      - src/data/awards.yaml
      - src/content/projects/**/*.md
      - docs/**/*.md
    exclude:
      - public/**
      - package-lock.json
      - dist/**
      - "**/node_modules/**"
      - "**/.git/**"

  - id: resume-tailor-agent
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 90
    repository: zhigao3ks/resume-tailor-agent
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/resume-tailor-agent
    local_path: ../resume-tailor-agent
    include:
      - README.md
      - docs/**/*.md
      - PROJECT_KNOWLEDGE.md
    exclude:
      - src/**
      - tests/**
      - '*.lock'
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-tools
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 85
    repository: zhigao3ks/zglab-tools
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-tools
    local_path: ../zglab-tools
    include:
      - README.md
      - docs/**/*.md
      - PROJECT_KNOWLEDGE.md
    exclude:
      - src/**
      - dist/**
      - node_modules/**
      - package-lock.json
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-daily
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 80
    repository: zhigao3ks/zglab-daily
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-daily
    local_path: ../zglab-daily
    include:
      - README.md
      - docs/**/*.md
      - PROJECT_KNOWLEDGE.md
    exclude:
      - frontend/node_modules/**
      - '**/__pycache__/**'
      - '*.db'
      - '*.sqlite*'
      - "**/node_modules/**"
      - "**/.git/**"

  - id: zglab-rag
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 95
    repository: zhigao3ks/zglab-rag
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/zglab-rag
    local_path: ../zglab-rag
    include:
      - README.md
      - docs/roadmap-v2.md
      - docs/architecture.md
      - docs/production-architecture.md
      - docs/authentication.md
      - docs/capability-architecture.md
      - docs/web-research-runtime.md
      - docs/web-evidence-grounding.md
      - docs/mcp-tool-runtime.md
      - docs/agent-architecture.md
      - docs/agent-product.md
      - docs/conversation-persistence.md
      - docs/conversation-context.md
      - docs/source-acquisition.md
      - docs/evaluations/phase-14-production-acceptance-2026-08-28.md
      - docs/evaluations/source-acquisition-production-acceptance-2026-09-02.md
    exclude:
      - web/**
      - src/**
      - tests/**
      - evaluation/**
      - runtime/**
      - models/**
      - "**/.git/**"

  - id: agentic
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 85
    repository: zhigao3ks/Agentic
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/Agentic
    local_path: ../Agentic
    include:
      - README.md
      - docs/**/*.md
    exclude:
      - app/**
      - tests/**
      - storage/**
      - "*.db"
      - "*.sqlite*"
      - .env
      - .env.*
      - "**/__pycache__/**"
      - "**/.git/**"

  - id: medical-multi-agent-system
    enabled: true
    kind: git
    scope: project
    visibility: public
    priority: 80
    repository: zhigao3ks/medical-multi-agent-system
    ref: main
    acquisition:
      provider: gitee
      repository: Zg443/medical-multi-agent-system
    local_path: ../medical-multi-agent-system
    include:
      - docs/00-项目概览.md
      - docs/02-架构设计详解.md
      - docs/03-Agent设计原理.md
      - docs/04-GraphRAG知识图谱.md
      - docs/05-FHIR-API集成.md
      - docs/06-HIPAA合规设计.md
    exclude:
      - python/**
      - java/**
      - go/**
      - docker/**
      - tests/**
      - "**/.git/**"

  # These documents are the only public, de-identified project knowledge.
  # Do not register their private source repositories as Git sources.
  - id: ai-meeting-assistant
    enabled: true
    kind: local
    scope: project
    visibility: public
    priority: 90
    path: knowledge/projects/ai-meeting-assistant.md
    include:
      - knowledge/projects/ai-meeting-assistant.md
    exclude: []

  - id: ai-contract-review
    enabled: true
    kind: local
    scope: project
    visibility: public
    priority: 90
    path: knowledge/projects/ai-contract-review.md
    include:
      - knowledge/projects/ai-contract-review.md
    exclude: []

# Private/company sources are intentionally absent from the public source registry.
# Do not add them to the public index merely because the GitHub account can access them.
